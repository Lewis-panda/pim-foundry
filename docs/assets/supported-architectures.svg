<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1124" viewBox="0 0 1280 1124" role="img" aria-labelledby="title description">
<title id="title">Four executable logical architectures supported by PIM Foundry</title><desc id="description">All four runs use the same four-device fabric. Panels show active placements and omit unused devices. Selected declared logical data-transfer links are shown, not chip packages. The direct SRAM to HBM links are omitted for clarity, and not every link carries traffic in each run. A common six-node tensor graph executes on analytical profiles: projection, ReLU, cast to FP16, head, cast to FP32 and softmax. All GPU places all nodes on GPU. HBM PIM plus GPU places the head on HBM. HBM PIM plus NPU places the head on HBM and other nodes on NPU. SRAM CIM plus HBM PIM plus GPU places projection on SRAM, head on HBM, and remaining nodes on GPU. Every device has local compute and finite memory. The host supplies inputs, weights and request state and receives outputs. Separate native simulator adapters support SRAM INT8 to INT32 and HBM FP16 matmul.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#087f83" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#3265af" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
