name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        profile: [core, onnx]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core package
        if: matrix.profile == 'core'
        run: python -m pip install .
      - name: Install tensor and ONNX extras
        if: matrix.profile == 'onnx'
        run: python -m pip install '.[onnx]'
      - name: Run all tests and record optional skips
        run: python scripts/ci_checks.py --profile '${{ matrix.profile }}' --report test-results.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-python-${{ matrix.python }}-${{ matrix.profile }}
          path: test-results.json
          if-no-files-found: warn
          retention-days: 14

  installed-wheel:
    name: Installed wheel / offline quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel and numerical dependency
        run: python -m pip install dist/*.whl numpy==2.2.6
      - name: Exercise installed package away from source tree
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cp examples/quickstart.py "$smoke_dir/quickstart.py"
          cd "$smoke_dir"
          python -I -c "import pim_foundry; print(pim_foundry.__file__)"
          pim-foundry --help
          python -I quickstart.py --out "$smoke_dir/results"
