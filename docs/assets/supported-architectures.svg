<text x="108" y="950" class="small">Same four-device fabric; unused devices omitted. Selected links shown; paired arrows are directed links.</text>
<text x="108" y="978" class="small">Each transfer reserves its link and both endpoint DMA resources. Each device has finite memory.</text>
<rect x="40" y="994" width="1200" height="92" rx="14" fill="#14263d" stroke="#14263d"/>
<text x="64" y="1025" class="node" style="fill:white">Native simulator adapters can replace compatible matmuls</text>
<text x="64" y="1055" class="body" style="fill:#d7e7f5">SRAM: INT8 × INT8 → INT32  ·  HBM: FP16 × FP16 → FP16  ·  GPU / NPU: analytical execution profiles</text>
<text x="64" y="1077" class="tiny" style="fill:#b7ccdf">External runtimes are required for native paths; the four portable gallery runs use illustrative analytical coefficients.</text>
<text x="1240" y="1112" class="tiny" text-anchor="end">Logical resource models; no physical packaging or measured hardware performance is implied.</text>
